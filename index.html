<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Portfolio Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #f5f7fa;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 28px;
    }

    .subtitle {
      color: #8f9baa;
      margin-bottom: 20px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #374151;
    }

    button.secondary:hover {
      background: #4b5563;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: #141a22;
      border: 1px solid #222b36;
      border-radius: 12px;
      padding: 18px;
    }

    .card-label {
      color: #8f9baa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
    }

    .status {
      color: #8f9baa;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      background: #141a22;
      border: 1px solid #222b36;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #222b36;
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: #8f9baa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #10151c;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .token {
      font-weight: bold;
    }

    .amount-input {
      width: 125px;
      padding: 8px 9px;
      border-radius: 7px;
      border: 1px solid #394554;
      background: #0c1117;
      color: white;
      text-align: right;
      font-size: 14px;
      outline: none;
    }

    .amount-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }

    .price-unavailable {
      color: #ef9a9a;
    }

    .updated {
      color: #7f8b99;
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      .container {
        padding: 12px;
      }

      h1 {
        font-size: 23px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .amount-input {
        width: 115px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Crypto Portfolio</h1>
  <div class="subtitle">
    Live prices · Editable amounts · Automatic valuation
  </div>

  <div class="topbar">
    <button onclick="refreshPrices()">↻ Refresh Prices</button>
    <button class="secondary" onclick="resetAmounts()">Reset Amounts</button>
  </div>

  <div class="summary">
    <div class="card">
      <div class="card-label">Portfolio Value</div>
      <div class="card-value" id="totalValue">$0.00</div>
    </div>

    <div class="card">
      <div class="card-label">Assets</div>
      <div class="card-value" id="assetCount">0</div>
    </div>

    <div class="card">
      <div class="card-label">Priced Assets</div>
      <div class="card-value" id="pricedCount">0</div>
    </div>
  </div>

  <div class="status" id="status">
    Loading prices...
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Token</th>
          <th>Amount</th>
          <th>Price</th>
          <th>Value</th>
          <th>Weight</th>
        </tr>
      </thead>

      <tbody id="portfolioBody"></tbody>
    </table>
  </div>

  <div class="updated" id="updated"></div>

</div>

<script>

const STORAGE_KEY = "cryptoPortfolioAmounts";

const portfolio = [
  { symbol: "UNI",   amount: 201.559,   id: "uniswap" },
  { symbol: "LINK",  amount: 57.483,    id: "chainlink" },
  { symbol: "AAVE",  amount: 5.012,     id: "aave" },
  { symbol: "SOL",   amount: 11.106,    id: "solana" },
  { symbol: "BNB",   amount: 1.407,     id: "binancecoin" },
  { symbol: "HYPE",  amount: 11.58,     id: "hyperliquid" },
  { symbol: "BTC",   amount: 0.02001204, id: "bitcoin" },
  { symbol: "NEAR",  amount: 275.2966,    id: "near" },
  { symbol: "MON",   amount: 9547,      id: "monad" },
  { symbol: "ADA",   amount: 1106.55,   id: "cardano" },
  { symbol: "SUI",   amount: 283.277,   id: "sui" },
  { symbol: "PUMP",  amount: 64365,     id: "pump-fun" },
  { symbol: "CAKE",  amount: 90.18,     id: "pancakeswap-token" },
  { symbol: "ETH",   amount: 0.74105,   id: "ethereum" },
  { symbol: "MORPHO", amount: 169.8,     id: "morpho" },
  { symbol: "COMP",  amount: 19.76,     id: "compound-governance-token" },
  { symbol: "AVAX",  amount: 44.26874,  id: "avalanche-2" },
  { symbol: "TRX",   amount: 702.37,  id: "tron" },
  { symbol: "STORM", amount: 30281,     id: "storm-trade" },
  { symbol: "XRP",   amount: 696.216,   id: "ripple" },
  { symbol: "TWT",   amount: 606,       id: "trust-wallet-token" }
];

let prices = {};

/*
  Load saved amounts from this browser.
*/
function loadSavedAmounts() {

  try {

    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    );

    if (!saved) return;

    portfolio.forEach(asset => {

      if (
        saved[asset.symbol] !== undefined &&
        !isNaN(Number(saved[asset.symbol]))
      ) {
        asset.amount = Number(saved[asset.symbol]);
      }

    });

  } catch (error) {

    console.log("Could not load saved amounts:", error);

  }
}


/*
  Save current amounts.
*/
function saveAmounts() {

  const saved = {};

  portfolio.forEach(asset => {
    saved[asset.symbol] = asset.amount;
  });

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(saved)
  );
}


/*
  Reset everything to the original portfolio amounts.
*/
function resetAmounts() {

  if (!confirm("Reset all amounts to the original values?")) {
    return;
  }

  portfolio[0].amount = 252.937;
  portfolio[1].amount = 57.483;
  portfolio[2].amount = 5.012;
  portfolio[3].amount = 11.106;
  portfolio[4].amount = 1.407;
  portfolio[5].amount = 11.58;
  portfolio[6].amount = 0.02001204;
  portfolio[7].amount = 333.89;
  portfolio[8].amount = 9547;
  portfolio[9].amount = 1106.55;
  portfolio[10].amount = 283.277;
  portfolio[11].amount = 64365;
  portfolio[12].amount = 90.18;
  portfolio[13].amount = 0.92865;
  portfolio[14].amount = 169.8;
  portfolio[15].amount = 19.76;
  portfolio[16].amount = 44.26874;
  portfolio[17].amount = 1327.985;
  portfolio[18].amount = 30281;
  portfolio[19].amount = 696.216;
  portfolio[20].amount = 606;

  saveAmounts();
  renderTable();
}


/*
  Format money.
*/
function money(value) {

  if (!isFinite(value)) {
    return "—";
  }

  return value.toLocaleString(
    "en-US",
    {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 2
    }
  );
}


/*
  Format crypto amounts.
*/
function formatAmount(value) {

  return Number(value).toLocaleString(
    "en-US",
    {
      maximumFractionDigits: 8
    }
  );
}


/*
  Format price.
*/
function formatPrice(value) {

  if (!isFinite(value)) {
    return "—";
  }

  if (value >= 1) {
    return money(value);
  }

  return "$" + value.toLocaleString(
    "en-US",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 8
    }
  );
}


/*
  Build the table.
*/
function renderTable() {

  const body = document.getElementById("portfolioBody");

  body.innerHTML = "";

  let total = 0;
  let pricedCount = 0;

  portfolio.forEach((asset, index) => {

    const price = prices[asset.id];

    let value = 0;

    if (price !== undefined) {

      value = asset.amount * price;

      total += value;

      pricedCount++;

    }

    const row = document.createElement("tr");

    row.innerHTML = `
      <td class="token">${asset.symbol}</td>

      <td>
        <input
          class="amount-input"
          type="number"
          step="any"
          value="${asset.amount}"
          data-index="${index}"
          aria-label="${asset.symbol} amount"
        >
      </td>

      <td class="${price === undefined ? "price-unavailable" : ""}">
        ${price === undefined ? "Unavailable" : formatPrice(price)}
      </td>

      <td>
        ${price === undefined ? "—" : money(value)}
      </td>

      <td>
        ${price === undefined || total === 0 ? "—" : ""}
      </td>
    `;

    body.appendChild(row);
  });

  /*
    Calculate weights after total is known.
  */
  const rows = body.querySelectorAll("tr");

  rows.forEach((row, index) => {

    const asset = portfolio[index];
    const price = prices[asset.id];

    const weightCell = row.children[4];

    if (
      price !== undefined &&
      total > 0
    ) {

      const value = asset.amount * price;

      weightCell.textContent =
        ((value / total) * 100).toFixed(2) + "%";

    } else {

      weightCell.textContent = "—";

    }
  });

  document.getElementById("totalValue").textContent =
    money(total);

  document.getElementById("assetCount").textContent =
    portfolio.length;

  document.getElementById("pricedCount").textContent =
    pricedCount;

  /*
    Attach interactive amount handlers.
  */
  document.querySelectorAll(".amount-input").forEach(input => {

    input.addEventListener("input", function () {

      const index = Number(this.dataset.index);

      let value = parseFloat(this.value);

      if (isNaN(value)) {
        value = 0;
      }

      portfolio[index].amount = value;

      saveAmounts();

      renderTable();

      /*
        Put cursor back into the edited field.
      */
      const newInput =
        document.querySelector(
          `.amount-input[data-index="${index}"]`
        );

      if (newInput) {

        newInput.focus();

        try {
          newInput.setSelectionRange(
            newInput.value.length,
            newInput.value.length
          );
        } catch (e) {}

      }

    });

  });
}


/*
  Fetch live prices from CoinGecko.
*/
async function refreshPrices() {

  const status =
    document.getElementById("status");

  status.textContent =
    "Updating live prices...";

  try {

    const ids = portfolio
      .map(asset => asset.id)
      .join(",");

    const url =
      "https://api.coingecko.com/api/v3/simple/price" +
      "?ids=" +
      encodeURIComponent(ids) +
      "&vs_currencies=usd";

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error(
        "CoinGecko returned " + response.status
      );
    }

    const data =
      await response.json();

    prices = {};

    portfolio.forEach(asset => {

      if (
        data[asset.id] &&
        data[asset.id].usd !== undefined
      ) {

        prices[asset.id] =
          Number(data[asset.id].usd);

      }

    });

    renderTable();

    const now =
      new Date().toLocaleString();

    document.getElementById("updated").textContent =
      "Last updated: " + now;

    const missing =
      portfolio.filter(
        asset => prices[asset.id] === undefined
      ).length;

    if (missing > 0) {

      status.textContent =
        `Prices updated. ${missing} asset(s) unavailable.`;

    } else {

      status.textContent =
        "All prices updated successfully.";

    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "Could not update prices. Try again in a moment.";

    renderTable();

  }
}


/*
  Start application.
*/
loadSavedAmounts();

renderTable();

refreshPrices();

</script>

</body>
</html>
