<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f14">

<title>Crypto Portfolio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f14;
  color: #f5f7fa;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 18px;
}

h1 {
  margin: 0 0 6px;
  font-size: 28px;
}

.subtitle {
  color: #8f9baa;
  margin-bottom: 18px;
}

.buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  color: white;
  background: #2563eb;
  cursor: pointer;
  font-size: 14px;
}

button.secondary {
  background: #374151;
}

button:active {
  transform: translateY(1px);
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.card {
  background: #141a22;
  border: 1px solid #222b36;
  border-radius: 12px;
  padding: 17px;
}

.card-label {
  color: #8f9baa;
  font-size: 13px;
  margin-bottom: 8px;
}

.card-value {
  font-size: 25px;
  font-weight: bold;
}

.status {
  font-size: 13px;
  color: #8f9baa;
  margin-bottom: 12px;
}

.status.ok {
  color: #4ade80;
}

.status.error {
  color: #f87171;
}

.table-wrap {
  overflow-x: auto;
  background: #141a22;
  border: 1px solid #222b36;
  border-radius: 12px;
}

table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
}

th,
td {
  padding: 12px 14px;
  border-bottom: 1px solid #222b36;
  text-align: right;
  white-space: nowrap;
}

th {
  background: #10151c;
  color: #8f9baa;
  font-size: 12px;
  text-transform: uppercase;
}

th:first-child,
td:first-child {
  text-align: left;
}

tr:last-child td {
  border-bottom: 0;
}

.token {
  font-weight: bold;
}

.amount {
  width: 125px;
  padding: 8px;
  border-radius: 7px;
  border: 1px solid #394554;
  background: #0c1117;
  color: white;
  text-align: right;
  font-size: 14px;
}

.amount:focus {
  outline: none;
  border-color: #3b82f6;
}

.unavailable {
  color: #f87171;
}

.updated {
  margin-top: 10px;
  color: #6f7b89;
  font-size: 12px;
}

.note {
  margin-top: 15px;
  color: #697586;
  font-size: 12px;
  line-height: 1.5;
}

@media (max-width: 700px) {

  .container {
    padding: 12px;
  }

  h1 {
    font-size: 23px;
  }

  .summary {
    grid-template-columns: 1fr;
  }

  .amount {
    width: 115px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>Crypto Portfolio</h1>

  <div class="subtitle">
    Live valuation · Editable amounts · No API key required
  </div>

  <div class="buttons">

    <button id="refresh">
      ↻ Refresh Prices
    </button>

    <button id="reset" class="secondary">
      Reset Amounts
    </button>

  </div>

  <div class="summary">

    <div class="card">
      <div class="card-label">
        Portfolio Value
      </div>

      <div class="card-value" id="total">
        $0.00
      </div>
    </div>

    <div class="card">
      <div class="card-label">
        Assets
      </div>

      <div class="card-value" id="assets">
        21
      </div>
    </div>

    <div class="card">
      <div class="card-label">
        Prices Available
      </div>

      <div class="card-value" id="priced">
        0
      </div>
    </div>

  </div>

  <div id="status" class="status">
    Loading prices...
  </div>

  <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>Token</th>
          <th>Amount</th>
          <th>Price</th>
          <th>Value</th>
          <th>Weight</th>
        </tr>

      </thead>

      <tbody id="table"></tbody>

    </table>

  </div>

  <div class="updated" id="updated"></div>

  <div class="note">
    Amounts are saved automatically on this device/browser.
    Prices are retrieved automatically from public market-data sources.
  </div>

</div>


<script>

/* =========================================================
   PORTFOLIO
   ========================================================= */

const portfolio = [

  { symbol:"UNI",    amount:201.559,    aliases:["UNI"] },
  { symbol:"LINK",   amount:57.483,     aliases:["LINK"] },
  { symbol:"AAVE",   amount:5.012,      aliases:["AAVE"] },
  { symbol:"SOL",    amount:11.106,     aliases:["SOL"] },
  { symbol:"BNB",    amount:1.407,      aliases:["BNB"] },
  { symbol:"HYPE",   amount:11.58,      aliases:["HYPE"] },
  { symbol:"BTC",    amount:0.02001204, aliases:["BTC","XBT"] },
  { symbol:"NEAR",   amount:275.2966,   aliases:["NEAR"] },
  { symbol:"MON",    amount:9547,       aliases:["MON"] },
  { symbol:"ADA",    amount:1106.55,    aliases:["ADA"] },
  { symbol:"SUI",    amount:283.277,    aliases:["SUI"] },
  { symbol:"PUMP",   amount:64365,      aliases:["PUMP"] },
  { symbol:"CAKE",   amount:90.18,      aliases:["CAKE"] },
  { symbol:"ETH",    amount:0.74105,    aliases:["ETH"] },
  { symbol:"MORPHO", amount:169.8,      aliases:["MORPHO"] },
  { symbol:"COMP",   amount:19.76,      aliases:["COMP"] },
  { symbol:"AVAX",   amount:44.26874,   aliases:["AVAX"] },
  { symbol:"TRX",    amount:702.38,     aliases:["TRX"] },
  { symbol:"STORM",  amount:30281,      aliases:["STORM"] },
  { symbol:"XRP",    amount:696.216,    aliases:["XRP"] },
  { symbol:"TWT",    amount:606,        aliases:["TWT"] }

];


/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_KEY =
  "crypto_portfolio_amounts_2026";


/* =========================================================
   PRICES
   ========================================================= */

let prices = {};


/* =========================================================
   ORIGINAL AMOUNTS
   ========================================================= */

const originalAmounts =
  portfolio.map(x => x.amount);


/* =========================================================
   LOAD SAVED AMOUNTS
   ========================================================= */

function loadAmounts() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    if (!saved) return;

    portfolio.forEach(asset => {

      if (
        saved[asset.symbol] !== undefined
      ) {

        const n =
          Number(saved[asset.symbol]);

        if (
          Number.isFinite(n) &&
          n >= 0
        ) {

          asset.amount = n;

        }

      }

    });

  } catch (e) {

    console.log(
      "Storage unavailable"
    );

  }

}


/* =========================================================
   SAVE AMOUNTS
   ========================================================= */

function saveAmounts() {

  const saved = {};

  portfolio.forEach(asset => {

    saved[asset.symbol] =
      asset.amount;

  });

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(saved)
    );

  } catch (e) {}

}


/* =========================================================
   RESET
   ========================================================= */

function resetAmounts() {

  if (
    !confirm(
      "Reset all crypto amounts to the original values?"
    )
  ) {
    return;
  }

  portfolio.forEach(
    (asset, i) => {

      asset.amount =
        originalAmounts[i];

    }
  );

  saveAmounts();

  render();

}


/* =========================================================
   MONEY
   ========================================================= */

function money(value) {

  if (!Number.isFinite(value)) {
    return "—";
  }

  return value.toLocaleString(
    "en-US",
    {
      style:"currency",
      currency:"USD",
      maximumFractionDigits:2
    }
  );

}


/* =========================================================
   PRICE FORMAT
   ========================================================= */

function priceFormat(value) {

  if (!Number.isFinite(value)) {
    return "—";
  }

  if (value >= 1) {

    return value.toLocaleString(
      "en-US",
      {
        style:"currency",
        currency:"USD",
        maximumFractionDigits:2
      }
    );

  }

  return "$" +
    value.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:10
      }
    );

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  const table =
    document.getElementById("table");

  table.innerHTML = "";


  let total = 0;

  let priced = 0;


  portfolio.forEach(asset => {

    const price =
      prices[asset.symbol];

    if (
      Number.isFinite(price)
    ) {

      total +=
        asset.amount * price;

      priced++;

    }

  });


  portfolio.forEach(
    (asset,index) => {

      const price =
        prices[asset.symbol];

      const value =
        Number.isFinite(price)
          ? asset.amount * price
          : null;

      const weight =
        value !== null &&
        total > 0
          ? (value / total) * 100
          : null;


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td class="token">
          ${asset.symbol}
        </td>

        <td>
          <input
            class="amount"
            type="number"
            min="0"
            step="any"
            inputmode="decimal"
            value="${asset.amount}"
            data-index="${index}"
          >
        </td>

        <td class="${
          price === undefined
            ? "unavailable"
            : ""
        }">

          ${
            price === undefined
              ? "Unavailable"
              : priceFormat(price)
          }

        </td>

        <td>
          ${
            value === null
              ? "—"
              : money(value)
          }
        </td>

        <td>
          ${
            weight === null
              ? "—"
              : weight.toFixed(2) + "%"
          }
        </td>

      `;


      table.appendChild(row);

    }
  );


  document.getElementById(
    "total"
  ).textContent =
    money(total);


  document.getElementById(
    "assets"
  ).textContent =
    portfolio.length;


  document.getElementById(
    "priced"
  ).textContent =
    priced;


  attachInputs();

}


/* =========================================================
   EDITABLE AMOUNTS

   The old version rebuilt the table on every keystroke.
   This version waits until the field changes, so editing
   amounts works properly on phone and desktop.
   ========================================================= */

function attachInputs() {

  document
    .querySelectorAll(".amount")
    .forEach(input => {

      input.addEventListener(
        "change",
        function() {

          const index =
            Number(
              this.dataset.index
            );

          let value =
            Number(this.value);


          if (
            !Number.isFinite(value) ||
            value < 0
          ) {

            value = 0;

          }


          portfolio[index].amount =
            value;


          saveAmounts();

          render();

        }
      );

    });

}


/* =========================================================
   PUBLIC MARKET DATA
   =========================================================

   First source:
   CoinPaprika public ticker feed.

   No API key is entered by the user.

   We download the public ticker list and match the
   symbols against the portfolio.
   ========================================================= */

async function getCoinPaprikaPrices() {

  const response =
    await fetch(
      "https://api.coinpaprika.com/v1/tickers?quotes=USD",
      {
        cache:"no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "Market data unavailable (" +
      response.status +
      ")"
    );

  }


  const data =
    await response.json();


  const result = {};


  /*
    Build symbol lookup.
  */

  data.forEach(coin => {

    if (
      !coin.symbol ||
      !coin.quotes ||
      !coin.quotes.USD
    ) {
      return;
    }


    const symbol =
      coin.symbol.toUpperCase();


    const price =
      Number(
        coin.quotes.USD.price
      );


    if (
      !Number.isFinite(price)
    ) {
      return;
    }


    /*
      Keep the first match.

      CoinPaprika normally has one primary
      listing per symbol in the main ticker feed.
    */

    if (
      result[symbol] === undefined
    ) {

      result[symbol] = price;

    }

  });


  return result;

}


/* =========================================================
   BINANCE FALLBACK

   Useful for BTC, ETH, SOL, BNB, XRP, ADA, AVAX,
   LINK, UNI, etc.

   This is only a fallback if CoinPaprika doesn't
   return a particular asset.
   ========================================================= */

async function getBinancePrices() {

  const response =
    await fetch(
      "https://api.binance.com/api/v3/ticker/price",
      {
        cache:"no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "Binance unavailable"
    );

  }


  const data =
    await response.json();


  const result = {};


  data.forEach(item => {

    const symbol =
      item.symbol;


    if (
      symbol.endsWith("USDT")
    ) {

      const crypto =
        symbol.slice(
          0,
          -4
        );


      const price =
        Number(item.price);


      if (
        Number.isFinite(price)
      ) {

        result[crypto] =
          price;

      }

    }

  });


  return result;

}


/* =========================================================
   REFRESH PRICES
   ========================================================= */

async function refreshPrices() {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "Updating live prices...";

  status.className =
    "status";


  let paprika = {};

  let binance = {};


  /*
    Try CoinPaprika.
  */

  try {

    paprika =
      await getCoinPaprikaPrices();

  } catch (e) {

    console.log(
      "CoinPaprika failed:",
      e
    );

  }


  /*
    Try Binance too.

    If it fails, CoinPaprika can still be used.
  */

  try {

    binance =
      await getBinancePrices();

  } catch (e) {

    console.log(
      "Binance fallback failed:",
      e
    );

  }


  /*
    Combine sources.

    CoinPaprika first.
    Binance fills gaps.
  */

  prices = {};


  portfolio.forEach(asset => {

    const symbol =
      asset.symbol.toUpperCase();


    if (
      Number.isFinite(
        paprika[symbol]
      )
    ) {

      prices[symbol] =
        paprika[symbol];

      return;

    }


    if (
      Number.isFinite(
        binance[symbol]
      )
    ) {

      prices[symbol] =
        binance[symbol];

    }

  });


  render();


  const available =
    portfolio.filter(
      asset =>
        Number.isFinite(
          prices[asset.symbol]
        )
    );


  const missing =
    portfolio.filter(
      asset =>
        !Number.isFinite(
          prices[asset.symbol]
        )
    );


  if (
    available.length ===
    portfolio.length
  ) {

    status.textContent =
      "✓ All portfolio prices updated.";

    status.className =
      "status ok";

  } else {

    status.textContent =
      available.length +
      " of " +
      portfolio.length +
      " prices available.";


    if (missing.length) {

      status.textContent +=
        " Missing: " +
        missing
          .map(x => x.symbol)
          .join(", ");

    }

  }


  document.getElementById(
    "updated"
  ).textContent =
    "Last checked: " +
    new Date().toLocaleString();

}


/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("refresh")
  .addEventListener(
    "click",
    refreshPrices
  );


document
  .getElementById("reset")
  .addEventListener(
    "click",
    resetAmounts
  );


/* =========================================================
   START
   ========================================================= */

loadAmounts();

render();

refreshPrices();


/*
  Automatically refresh every 5 minutes.
*/

setInterval(
  refreshPrices,
  5 * 60 * 1000
);

</script>

</body>
</html>
